experiment_name: medium_tuned_missing_ecg_no_kd_mse0_3
seed: 42
device: auto
data:
  processed_dir: Processed_dataset/muse_physio_baseline
  train_batch_size: 16
  evaluation_batch_size: 4
  num_workers: 0
student_input:
  mode: select
  available_modalities:
  - BPM
  - RESP
model:
  architecture: encoder_only_time_series_transformer
  input_dim: 2
  d_model: 80
  num_heads: 2
  num_layers: 3
  dim_feedforward: 240
  dropout: 0.1
  activation: gelu
  norm_first: true
  max_sequence_length: 1024
loss:
  ccc_weight: 1.0
  mse_weight: 0.3
optimizer:
  learning_rate: 0.0001
  weight_decay: 0.0001
scheduler:
  factor: 0.5
  patience: 5
  min_learning_rate: 1.0e-06
training:
  epochs: 200
  early_stopping_patience: 30
  gradient_clip_norm: 1.0
  output_dir: outputs/ablations/medium_tuned_missing_modalities/missing_ecg/no_kd_mse0_3
