experiment_name: medium_teacher_target_mse_1_0
seed: 42
device: auto
data:
  processed_dir: Processed_dataset/muse_physio_baseline
  train_batch_size: 16
  evaluation_batch_size: 4
  num_workers: 0
model:
  architecture: encoder_only_time_series_transformer
  input_dim: 3
  d_model: 192
  num_heads: 4
  num_layers: 4
  dim_feedforward: 384
  dropout: 0.1
  activation: gelu
  norm_first: true
  max_sequence_length: 1024
loss:
  ccc_weight: 1.0
  mse_weight: 1.0
optimizer:
  learning_rate: 0.0001
  weight_decay: 0.0001
scheduler:
  factor: 0.5
  patience: 5
  min_learning_rate: 1.0e-06
training:
  epochs: 200
  early_stopping_patience: 30
  gradient_clip_norm: 1.0
  output_dir: outputs/ablations/medium_hyperparameter_sweep/target_loss/mse_1_0/teacher
