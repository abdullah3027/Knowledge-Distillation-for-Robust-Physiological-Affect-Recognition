experiment_name: "transformer_teacher"
seed: 42
device: "auto"

data:
  processed_dir: "Processed_dataset/muse_physio_baseline"
  train_batch_size: 16
  evaluation_batch_size: 4
  num_workers: 0

model:
  architecture: "encoder_only_time_series_transformer"
  input_dim: 3
  d_model: 128
  num_heads: 4
  num_layers: 4
  dim_feedforward: 256
  dropout: 0.1
  activation: "gelu"
  norm_first: true
  max_sequence_length: 1024

loss:
  ccc_weight: 1.0
  mse_weight: 0.1

optimizer:
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4

scheduler:
  factor: 0.5
  patience: 5
  min_learning_rate: 1.0e-6

training:
  epochs: 200
  early_stopping_patience: 30
  gradient_clip_norm: 1.0
  output_dir: "outputs/transformer_teacher"
